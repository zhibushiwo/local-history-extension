<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 我的历史记录</title>
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>

<div class="settings-wrap">
  <header class="settings-header">
    <div class="brand">
      <span class="logo">🕘</span>
      <h1>设置</h1>
    </div>
    <button type="button" class="btn" id="nav-history">← 返回历史记录</button>
  </header>

  <div class="settings-card">
    <div class="setting-row">
      <div class="setting-text">
        <b>记录页面停留时长</b>
        <span class="setting-hint">按前台聚焦与系统空闲推算，在条目和统计中显示 ⏱ 时长</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="recordDwell">
        <span class="track"></span>
      </label>
    </div>

    <div class="setting-row">
      <div class="setting-text">
        <b>空闲判定阈值（秒）</b>
        <span class="setting-hint">超过该时长无键鼠输入即停止计时（15–3600）</span>
      </div>
      <input type="number" id="idleThresholdSec" class="input num" min="15" max="3600" step="5">
    </div>

    <div class="setting-row">
      <div class="setting-text">
        <b>列表每次渲染条数</b>
        <span class="setting-hint">滚动到底部时每次追加加载的记录数</span>
      </div>
      <select id="pageSize" class="input num">
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="500">500</option>
      </select>
    </div>

    <div class="setting-row">
      <div class="setting-text">
        <b>备份提醒档位</b>
        <span class="setting-hint">记录总数每超过一档提醒一次导出备份</span>
      </div>
      <select id="backupStep" class="input num">
        <option value="10000">1 万条</option>
        <option value="50000">5 万条</option>
        <option value="100000">10 万条</option>
      </select>
    </div>

    <div class="settings-actions">
      <button type="button" class="btn" id="resetBtn">恢复默认</button>
      <button type="button" class="btn-small primary" id="saveBtn">保存设置</button>
    </div>
  </div>

  <p class="settings-note">设置保存后立即生效（记录与停留时长的变更无需重启浏览器）。</p>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="settings.js"></script>
</body>
</html>
